<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/608e9d3ec2.js" crossorigin="anonymous"></script>
  <script type="text/javascript" src="https://cdn.emailjs.com/sdk/3.11.0/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" type="image/x-icon" href="assets/Images/eman_logo2.png">
  <title>Portfolio</title>
</head>
<body>

  <!-- NAV -->
  <nav>
    <img src="assets/Images/eman_logo2.png" alt="logo" class="logo">
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <ul id="nav-links"></ul>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
      <i class="fa-solid fa-moon"></i>
    </button>
  </nav>

  <!-- HOME -->
  <section class="Home" id="home">
    <div class="homeInfo" id="home-info"></div>
    <div class="homeImg" id="home-img">
      <div class="shape2"></div>
      <div class="shape1">
        <img id="profile-photo" src="" alt="">
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="about" id="about">
    <div class="section-title reveal">
      <h2>About <span>Me</span></h2>
    </div>
    <div class="about-container reveal" id="about-content"></div>
  </section>

  <!-- SKILLS -->
  <section class="skills" id="skills">
    <div class="section-title reveal">
      <h2>My <span>Skills</span></h2>
      <p>Technologies I work with</p>
    </div>
    <div class="skills-groups reveal" id="skills-groups"></div>
  </section>

  <!-- WORK EXPERIENCE -->
  <section class="experience" id="experience">
    <div class="section-title reveal">
      <h2>Work <span>Experience</span></h2>
      <p>My professional journey so far</p>
    </div>
    <div class="experience-list reveal"></div>
  </section>

  <!-- INTERNSHIPS -->
  <section class="internships" id="internships">
    <div class="section-title reveal">
      <h2>Internship <span>&amp; Training</span></h2>
    </div>
    <div class="internship-timeline"></div>
  </section>

  <!-- PROJECTS -->
  <section class="projectSection" id="projects">
    <div class="section-title reveal">
      <h2>My <span>Projects</span></h2>
    </div>
    <!-- Featured projects -->
    <div class="featured-projects reveal" id="featured-projects"></div>
    <!-- All projects grid -->
    <div class="filter reveal">
      <button class="active" id="all">All</button>
      <button id="full">Full Stack</button>
      <button id="frontend">Frontend</button>
      <button id="backend">Backend</button>
      <button id="db">Database</button>
    </div>
    <div class="projects reveal" id="project-list"></div>
  </section>

  <!-- CONTACT -->
  <section class="contact" id="contact">
    <div class="contact-container">
      <h2 class="reveal">Contact <span>Me!</span></h2>
      <h3 class="contact-title reveal">Have You Any Questions?</h3>
      <div class="row reveal" id="contact-info"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footerConainer" id="footer-content"></div>
    <div class="Copyright" id="footer-copyright"></div>
  </footer>

  <script src="assets/script.js"></script>
</body>
</html>
